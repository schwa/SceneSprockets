# Swift Build (SwiftPM 6.4's default) writes no index store where Periphery looks. Build with the native build system
# first (this step builds, then reports a missing index store), then scan its index store:
#   periphery scan -- --build-system native --scratch-path .build/periphery
#   periphery scan --index-store-path .build/periphery/arm64-apple-macosx/debug/index/store
retain_public: true
# Hashable cache keys and GPU layout structs have properties that are only read through synthesized conformances.
retain_assign_only_properties: true
retain_unused_protocol_func_params: true
report_include:
  - Sources/**
  - Tests/**
