excluded:
  - "**/.build"
  - "**/.swiftpm"
  - "**/DerivedData"
  - "**/Package.swift"
disabled_rules:
  - explicit_top_level_acl
  - missing_docs
  - identifier_name
  - line_length
  - file_length
  - type_body_length
  - function_body_length
  - function_parameter_count
  - cyclomatic_complexity
  - large_tuple
  # `_ = x` is not a statement in result builders.
  - redundant_discardable_let
  - force_unwrapping
  - multiline_call_arguments
  # Keynote code panels are string literals.
  - indentation_width
  # #expect cannot expand key paths passed to rethrowing functions such as allSatisfy.
  - prefer_key_path
